island:'Chegamos! Está fazendo sol. Vamos dar um chapéu para cada amigo?',
islandDone:'Agora cada amigo tem um chapéu. Todos podem passear protegidos do sol!',
ending:'Se quiser, agora você pode brincar com o vovô. Escolha três brinquedos e dê um objeto para cada um. Vocês também podem desenhar a viagem.',
travel:'Vamos até a ilha!'
};
const active=()=>state.scene==='dock'||state.scene==='island';
const complete=()=>state.positions.every(p=>p>=0)&&new Set(state.positions).size===3;
const object=()=>state.scene==='island'?'👒':'🧺';

const audioPlayer=window.GigiAudio.create({
 window,document,lang:'pt-BR',rate:1.05,pitch:1.14,maxSpeakMs:30000,
 onCaption(text){$('instruction').textContent=text;},
 onDiagnostics(d){
  if(!muted&&(d.lastError||d.lastMode==='caption-only')){
   audioWarning('A voz não tocou ou foi interrompida. Confira o volume e toque em Ouvir a Lia. Um adulto pode ler a instrução.');
  }
 }
});
function cancelSpeech(){clearTimeout(voiceTimer);audioPlayer.stop();}
function stopScene(){
 epoch++;clearTimeout(travelTimer);travelTimer=null;cancelSpeech();drag=null;suppressClick=false;
}
function audioWarning(message){$('audioStatus').hidden=false;$('audioStatus').textContent=message}
function speak(text){
 cancelSpeech();
 if(document.hidden)return;
 $('audioStatus').hidden=true;
 audioPlayer.setMuted(muted);
 audioPlayer.unlock();
 audioPlayer.speak(text);
}
function instruction(){return active()&&complete()?lines[state.scene+'Done']:lines[state.scene]}
function remember(){state.history.push([...state.positions])}
function deliver(id,destination){
 if(!active()||id<0||id>2)return;
 const other=state.positions.findIndex((p,i)=>p===destination&&i!==id);
 if(other>=0){
  const text=state.scene==='dock'?'Esse bichinho já tem um cesto. Você pode devolver o cesto dele ou procurar quem ainda está sem.':'Esse amigo já tem um chapéu. Você pode devolver o chapéu dele ou procurar quem ainda está sem.';
  $('status').textContent=text;speak(text);return;
 }
 if(state.positions[id]===destination){state.selected=null;render();return;}
 remember();state.positions[id]=destination;state.selected=null;render();
 if(complete()){audioPlayer.chime('ok');speak(instruction());}
}
function reset(scene='intro'){
 stopScene();state={scene,positions:[-1,-1,-1],selected:null,history:[],hints:0};$('audioStatus').hidden=true;render();
}
function select(id){
 if(!active())return;
 if(state.positions[id]>=0){remember();state.positions[id]=-1;state.selected=null;}
 else state.selected=state.selected===id?null:id;
 render();
}
function target(destination){
 if(state.selected!==null)deliver(state.selected,destination);
 else{
  const item=state.positions.indexOf(destination);
  if(item>=0)select(item);
  else{$('status').textContent='Escolha primeiro um '+(state.scene==='dock'?'cesto.':'chapéu.');speak($('status').textContent);}
 }
}
function createButton(label,icon,handler){
 const b=document.createElement('button');b.textContent=icon;b.setAttribute('aria-label',label);b.onclick=handler;return b;
}
function makeObject(id){
 let dragged=false;
 const b=createButton((state.scene==='dock'?'Cesto ':'Chapéu ')+(id+1),object(),()=>{if(dragged){dragged=false;return}select(id)});
 b.className='object'+(state.selected===id?' active':'');b.setAttribute('aria-pressed',String(state.selected===id));b.dataset.object=id;
 b.onpointerdown=e=>{if(!active()||e.button!==0)return;drag={id,x:e.clientX,y:e.clientY,pointer:e.pointerId,moved:false};b.setPointerCapture?.(e.pointerId)};
 b.onpointermove=e=>{if(drag&&drag.pointer===e.pointerId&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10)drag.moved=true};
 b.onpointerup=e=>{
  if(!drag||drag.pointer!==e.pointerId)return;
  const d=drag;drag=null;
  if(!d.moved)return;
  dragged=true;e.preventDefault();
  const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-target]');
  if(hit)deliver(d.id,Number(hit.dataset.target));
  else if(document.elementFromPoint(e.clientX,e.clientY)?.closest('#tray')&&state.positions[d.id]>=0){remember();state.positions[d.id]=-1;state.selected=null;render()}
  else{$('status').textContent='O objeto voltou ao lugar. Você também pode tocar nele e depois num amigo.';}
 };
 b.onpointercancel=()=>{drag=null;suppressClick=false};
 return b;
}
function render(){
 draw();$('title').textContent={intro:'Um passeio pela costa',dock:'Todos a bordo',travel:'A caminho da ilha',island:'Sol na ilha',ending:'Uma aventura para continuar em casa'}[state.scene];
 $('instruction').textContent=instruction();
 $('status').textContent='';
 $('friends').replaceChildren();$('tray').replaceChildren();
 $('friends').className=state.scene==='island'?'island':'';
 $('tray').hidden=!active();$('hint').hidden=!active()||complete();
 $('undo').hidden=!active();$('undo').disabled=!state.history.length;
 $('boat').hidden=state.scene!=='travel';$('boat').className=state.scene==='travel'&&!$('reduce').checked?'sailing':'';
 $('go').hidden=active()&&!complete()||state.scene==='travel';
 $('go').textContent={intro:'⛵ Começar',dock:'⛵ Embarcar',island:'☀️ Continuar',ending:'↻ Brincar de novo'}[state.scene]||'';
 if(active()){
  const animals=state.scene==='dock'?['🐰','🐻','🐱']:['🐵','🐶','🐼'];
  animals.forEach((animal,destination)=>{
   const friend=document.createElement('div');friend.className='friend';
   const art=document.createElement('span');art.className='animal';art.textContent=animal;art.setAttribute('aria-hidden','true');friend.append(art);
   const id=state.positions.indexOf(destination);
   const b=createButton('Amigo '+(destination+1)+(id>=0?', com objeto. Toque para devolver.':', sem objeto.'),id>=0?object():'＋',()=>target(destination));
   b.className='target'+(id>=0?' full':'');b.dataset.target=destination;friend.append(b);
   $('friends').append(friend);
  });
  state.positions.forEach((p,id)=>{if(p<0)$('tray').append(makeObject(id))});
  if(complete())$('status').textContent=instruction();
 }
}
$('go').onclick=()=>{
 if(state.scene==='intro'){reset('dock');speak(lines.intro);}
 else if(state.scene==='dock'&&complete()){
  stopScene();state.scene='travel';render();audioPlayer.chime('embarcar');speak(lines.travel);
  const version=epoch;travelTimer=setTimeout(()=>{if(version===epoch){reset('island');speak(lines.island)}},$('reduce').checked?1000:2800);
 }else if(state.scene==='island'&&complete()){reset('ending');speak(lines.ending)}
 else if(state.scene==='ending'){reset('dock');speak(lines.intro)}
};
$('restart').onclick=()=>{reset('intro');};
$('repeat').onclick=()=>{
 if(state.scene==='travel'&&!travelTimer){reset('island');speak(lines.island);return;}
 speak(instruction());
};
$('hint').onclick=()=>{
 const item=state.scene==='dock'?'cesto':'chapéu';state.hints++;
 const text=state.hints===1?'Quem ainda está sem '+item+'?':'Toque num '+item+'. Depois toque num amigo que ainda não recebeu.';
 $('instruction').textContent=text;speak(text);
 if(state.hints>=2){
  const first=state.positions.indexOf(-1);state.selected=first<0?null:first;
  const empty=[0,1,2].find(i=>!state.positions.includes(i));
  render();$('instruction').textContent=text;
  if(empty!==undefined)$('friends').querySelector('[data-target="'+empty+'"]')?.setAttribute('aria-pressed','true');
 }
};
$('undo').onclick=()=>{if(state.history.length){cancelSpeech();audioPlayer.chime('undo');state.positions=state.history.pop();state.selected=null;render();}};
$('mute').onclick=()=>{muted=!muted;cancelSpeech();audioPlayer.setMuted(muted);$('mute').textContent=muted?'🔇 Som desligado':'🔊 Som ligado';$('mute').setAttribute('aria-pressed',String(muted));$('audioStatus').hidden=muted;};
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){
  cancelSpeech();
  if(state.scene==='travel'){clearTimeout(travelTimer);travelTimer=null;audioWarning('Passeio pausado. Ao voltar, toque em Ouvir a Lia para chegar à ilha.');}
 }
});
window.addEventListener('pagehide',()=>stopScene());
window.LiaActivity={dispose:()=>{stopScene();audioPlayer.dispose();}};
reset();
})();
</script></html>
